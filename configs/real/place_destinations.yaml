# 놓기 목적지 좌표 — D-AI-75 (놓기 스크립트는 트랙 B 가 짠다)
#
# ⚠️ **아래 좌표는 실측이 아니다.** 도달 포락선 안에 들어가도록 고른 **예시값**이고,
#    실물에 올리려면 김현석(트레이·지그 실제 위치)과 황도경(로봇 기준 좌표)이 채워야 한다.
#    `status: measured` 가 아니면 `place_scripts.py` 가 궤적을 내지 않는다.
#
# 좌표계: 로봇 베이스. 단위 m. z 는 테이블 위 높이.
# 근거 범위: MEASURE_task2_envelope_0916 측면 파지 도달 포락선
#            x 0.34~0.46 · y ±0.175 · z 0.027~0.051 (파지 높이)

status: provisional        # measured 로 바꾸기 전에는 실물 금지
source: "예시값. 실측 아님 (2026-09-19 김준태 작성)"

# 물체를 놓기 전에 들어올리는 높이 [m]. 테이블·다른 물체와의 충돌 여유.
approach_clearance_m: 0.06

# 놓은 뒤 물러나는 거리 [m]. 그리퍼가 물체를 다시 건드리지 않게.
retreat_m: 0.05

# 그리퍼 개구 [m]
hold_gap_m: 0.041          # 쥔 상태. 케이스 폭 38.5mm + 여유 (D-AI-70)
open_gap_m: 0.090          # 개방. URDF 상한

destinations:
  left_tray:
    xyz: [0.38, 0.130, 0.035]
    yaw_deg: 0.0
  right_tray:
    xyz: [0.38, -0.130, 0.035]
    yaw_deg: 0.0
  fixture:
    xyz: [0.42, 0.000, 0.035]
    yaw_deg: 0.0
    align_tolerance_deg: 3.0     # 지그는 자세를 맞춰야 한다
  origin:
    xyz: [0.40, 0.000, 0.035]
    yaw_deg: 0.0
  target_pose:
    # line_up 은 인덱스로 계산한다. 아래는 0번 칸.
    xyz: [0.36, -0.120, 0.035]
    yaw_deg: 0.0
    line_up_step_m: 0.060        # 칸 간격. y 방향으로 증가
    line_up_count: 5

# present_inspect 전용 — 카메라 앞에 들어 보이는 자세
present:
  xyz: [0.36, 0.000, 0.120]
  rotate_deg: 40.0               # 손목을 좌우로 흔들어 보여준다
  hold_seconds: 1.5
