# ver1 (phone-holder) grasp geometry — overrides only the `grasp` block.
# ver1(폰 홀더) 파지 기하 — `grasp` 블록만 덮어쓴다.
#
# 출처: 황도경(트랙 A) 회신 2026-09-15 · `configs/real/so101_ver1_phone_holder_kinematic.json`
# 기준 좌표계: wrist_roll 다음의 `gripper` 링크 원점
#
# ⚠️ 이 파일은 **도달영역 재측정용**이다. 학습·수집 파이프라인은 `configs/so101.yaml`
#    을 그대로 쓴다. 기존 sim_pick_* 데이터와 0915 롤아웃 수치(63.7% 등)가 전부
#    그 설정에서 나왔기 때문이다. 두 설정의 수치를 같은 표에 놓지 마라.
#
#   # [서버]
#   python tools/reach_scan.py --grasp-override configs/grasp_so101_ver1.yaml \
#       --wrist-roll 0.0 --log

grasp:
  # 레거시 -0.080 대비 78.1mm 더 길다. 도경님 회신의 78mm 와 일치.
  # x·y 성분은 1e-6 m 미만이라 0 으로 둔다 (그대로 넣어도 수치상 차이 없음).
  pinch_offset_local: [0.0, 0.0, -0.158118819]

# ---------------------------------------------------------------------------
# 이 파일이 담지 못하는 것 — 읽는 사람이 속지 않게 적어 둔다
#
# 1. jaw 축이 바뀌었다. gripper 로컬에서 (-0.048656744, 0.998815559, -0.000003629)
#    이고, 레거시 jaw(+X) 기준 로컬 +Z 주위 약 +92.79° 다.
#    ⚠️ 현행 IK(`solve_pose_ik`)는 **접근축 하나만** 구속하고 jaw 방향은 구속하지
#    않는다. wrist_roll 을 고정해 간접적으로 정할 뿐이다. 따라서 이 파일에 jaw 축을
#    적어도 스캔이 그것을 쓰지 않는다. 적지 않는 이유가 이것이다.
#
#    같은 물리적 jaw 방향을 재현하려면 스캔 인자로 보정해야 한다 🟡:
#        레거시  --wrist-roll 0.0
#        ver1    --wrist-roll -1.619     (= -92.79°, 관절범위 [-2.744, 2.841] 안)
#    이 보정은 **내 유도이지 트랙 A 가 준 값이 아니다.** 검증 전까지 🟡 이다.
#
# 2. 측면 파지의 `approach_axis` 는 여기 없다. 레거시는 [0,0,-1](수직 하강)이고
#    측면 접근은 수평이라 값이 다르지만, 어느 수평 방향인지는 물체 등록 방식에
#    달려 있어 트랙 A 확인이 필요하다. 추정해서 넣지 않는다.
#
# 3. `approach_height_m` · `grasp_z_offset_m` 은 레거시 값을 그대로 쓴다.
#    ver1 패드 치수 실측이 오면 다시 본다.
